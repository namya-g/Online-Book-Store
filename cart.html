<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLINE BOOK STORE</title>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 18px;
        }
        th, td {
            border: 1px solid #779ECB;
            padding: 10px;
        }
        th {
            background-color: #AEC6CF;
        }
        img {
            width: 60px;
            height: 80px;
        }
        input {
            font-family: inherit;
            font-size: 16px;
        }
        input[type="number"] {
            width: 45px;
        }
        h3 {
            text-align: right;
        }
    </style>
</head>
<body>
    <h2>SHOPPING CART</h2>
    <table>
        <tr>
            <th>Book Cover</th>
            <th>Book Name</th>
            <th>Author Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
        <tr>
            <td><img src="book1.jpg" alt="Book Cover"></td>
            <td>Data Structures</td>
            <td>Reema Thareja</td>
            <td>Rs. 600</td>
            <td><input type="number" value="1" min="1"></td>
            <td>Rs. 600</td>
        </tr>
        <tr>
            <td><img src="book7.jpg" alt="Book Cover"></td>
            <td>Digital System Design</td>
            <td>M. Morris Mano</td>
            <td>Rs. 550</td>
            <td><input type="number" value="1" min="1"></td>
            <td>Rs. 550</td>
        </tr>
    </table>
    <h3>Grand Total: Rs. 1800</h3>
</body>
</html>
