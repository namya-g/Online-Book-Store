<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>ONLINE BOOK STORE</title>
    <style>
        :root{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

            height: 12vh;
            font-size: 40px;

            align-items: center;

        .logo{

        .title{

        }
        .left{
            width: 200px;
            border: 1px solid black;
        }
        .left a{
            text-decoration: none;
            color: black;
            display: flex;
            flex-direction: column;
            font-size: 40px;
        }
        .right{
            flex: 1;
            border: 1px solid black;
            padding: 20px;
        }
        .right iframe{
            height: 100%;
            width: 100%;
            border: none;
            
        }
        .main{
            display: flex;
            height: 500px;
            background-color: #D4E5ED;
        }
        .menu a{
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
