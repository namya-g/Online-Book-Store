<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLINE BOOK STORE</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h2 {
            text-align: center;
        }

        form {
            width: 350px;
            margin: 20px auto;
            font-size: 18px;
        }

        input, select, textarea {
            font-family: inherit;
            font-size: 16px;
            padding: 5px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
        }

    </style>
</head>

<body>

    <h2>REGISTRATION FORM</h2>

    <form>

        <label for="name">Name</label>

        <br><br>

        <input type="text" id="name" name="name" placeholder="Enter Name" required>

        <br><br>

        <label for="password">Password</label>

        <br><br>

        <input type="password" id="password" name="password" placeholder="Enter Password" required>

        <br><br>

        <label for="email">E-mail ID</label>

        <br><br>

        <input type="text" id="email" name="email" placeholder="Enter E-mail ID" required>

        <br><br>

        <label for="phone">Phone Number</label>

        <br><br>

        <input type="text" id="phone" name="phone" placeholder="Enter Phone Number" required>

        <br><br>

        <label>Sex</label>

        <br><br>

        <input type="radio" id="male" name="sex" value="Male">

        <label for="male">Male</label>

        <input type="radio" id="female" name="sex" value="Female">

        <label for="female">Female</label>

        <br><br>

        <label>Date of Birth</label>

        <br><br>

        <select name="day" required>
            <option value="">Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
        </select>

        <select name="month" required>
            <option value="">Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>

        <select name="year" required>
            <option value="">Year</option>
            <option>2000</option>
            <option>2001</option>
            <option>2002</option>
            <option>2003</option>
            <option>2004</option>
            <option>2005</option>
            <option>2006</option>
            <option>2007</option>
            <option>2008</option>
        </select>

        <br><br>

        <label>Languages Known</label>

        <br><br>

        <input type="checkbox" id="english" name="language" value="English">

        <label for="english">English</label>

        <br>

        <input type="checkbox" id="telugu" name="language" value="Telugu">

        <label for="telugu">Telugu</label>

        <br>

        <input type="checkbox" id="hindi" name="language" value="Hindi">

        <label for="hindi">Hindi</label>

        <br>

        <input type="checkbox" id="tamil" name="language" value="Tamil">

        <label for="tamil">Tamil</label>

        <br><br>

        <label for="address">Address</label>

        <br><br>

        <textarea id="address" name="address" rows="4" placeholder="Enter Address"></textarea>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
